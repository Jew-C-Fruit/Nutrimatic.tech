<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 900" width="960" height="900" role="img" aria-labelledby="nm-title nm-desc">
  <!--
    Nutrimatic Website - machine.svg
    Version 2.2.0
    Created: 2026-09-13 - Animated flat elevation of the kiosk for the splash page (v1.0.0)
    Modified: 2026-09-15 - Two cartridge doors (8 slots) with product callouts, centred screen, sliding port door (v2.0.0)
    Modified: 2026-09-15 - Upper door aligned to the screen top, lower door to the port bottom, taller bottle,
    larger labels shown longer; loop lengthened to 16 s (v2.1.0)
    Modified: 2026-09-17 - Hard edges: no rounded corners except the bottle (v2.2.0)
    Loop (16 s): both doors lift and the labels appear; the screen runs a 45 s mix; the port door slides open
    on the bottle. Reduced motion shows the "ready" state. Inlined by js/site.js so labels use the site font.
  -->
  <title id="nm-title">Nutrimatic kiosk</title>
  <desc id="nm-desc">A white wall-standing kiosk with a touchscreen, two lift-up doors revealing eight labelled cartridges, and a small port with a sliding door where the finished bottle appears.</desc>
  <defs>
    <radialGradient id="nm-glow" cx="50%" cy="45%" r="60%"><stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
    <linearGradient id="nm-lid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dededa"/></linearGradient>
    <linearGradient id="nm-bay" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c0c0d"/><stop offset="1" stop-color="#1f1f22"/></linearGradient>
    <clipPath id="nm-door-clip"><rect x="210" y="40" width="250" height="190"/></clipPath>
    <clipPath id="nm-door2-clip"><rect x="210" y="242" width="250" height="190"/></clipPath>
    <clipPath id="nm-port"><rect x="70" y="302" width="90" height="130"/></clipPath>
    <path id="nm-mark" d="M81.654 31.555L81.654 68.204C81.654 79.824 77.439 83.401 70.16 83.401C62.881 83.401 58.955 79.933 58.809 68.445L58.825 30.648C58.825 11.749 51.165 0.0 34.053 0.0C27.03 0.0 21.41 2.682 18.346 5.876L18.346 1.405L0.725 1.405L0.725 68.445L18.346 68.445L18.346 31.797C18.346 20.176 22.559 16.601 29.84 16.601C37.12 16.601 41.045 20.068 41.191 31.557L41.173 69.354C41.173 88.253 48.835 100.0 65.947 100.0C72.97 100.0 78.589 97.318 81.654 94.126L81.654 98.595L99.275 98.595L99.275 31.555L81.654 31.555L81.654 31.555Z" fill-rule="evenodd"/>
  </defs>
  <style>
    .nm-door, .nm-door2 { transform-box: fill-box; transform-origin: 50% 0%; }
    .nm-door { animation: nm-door 16s ease-in-out infinite; }
    .nm-door2 { animation: nm-door2 16s ease-in-out infinite; }
    .nm-cart-glow { opacity: 0.25; animation: nm-cart-glow 16s ease-in-out infinite; }
    .nm-callouts { opacity: 0; animation: nm-callouts 16s ease-in-out infinite; }
    .nm-breathe { transform-box: fill-box; transform-origin: 50% 50%; animation: nm-breathe 2.6s ease-in-out infinite; }
    .nm-progress { transform-box: fill-box; transform-origin: 50% 50%; transform: rotate(-90deg); stroke-dasharray: 226.2; stroke-dashoffset: 226.2; opacity: 0; animation: nm-progress 16s linear infinite; }
    .nm-tap { animation: nm-tap 16s linear infinite; }
    .nm-check { opacity: 0; animation: nm-check 16s linear infinite; }
    .nm-port-glow { animation: nm-port-glow 16s ease-in-out infinite; }
    .nm-portdoor { transform: translateY(-134px); animation: nm-portdoor 16s ease-in-out infinite; }
    .nm-bottle { animation: nm-bottle 16s ease-out infinite; }

    @keyframes nm-door { 0%, 3% { transform: scaleY(1); } 8%, 36% { transform: scaleY(0.09); } 41%, 100% { transform: scaleY(1); } }
    @keyframes nm-door2 { 0%, 5% { transform: scaleY(1); } 10%, 38% { transform: scaleY(0.09); } 43%, 100% { transform: scaleY(1); } }
    @keyframes nm-cart-glow { 0%, 6% { opacity: 0.25; } 11%, 34% { opacity: 1; } 40%, 100% { opacity: 0.25; } }
    @keyframes nm-callouts { 0%, 9% { opacity: 0; } 12%, 34% { opacity: 1; } 37%, 100% { opacity: 0; } }
    @keyframes nm-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    @keyframes nm-progress { 0%, 44% { stroke-dashoffset: 226.2; opacity: 0; } 44.5% { opacity: 1; } 70% { stroke-dashoffset: 0; opacity: 1; } 72%, 100% { stroke-dashoffset: 0; opacity: 0; } }
    @keyframes nm-tap { 0%, 43% { opacity: 1; } 44%, 92% { opacity: 0; } 95%, 100% { opacity: 1; } }
    @keyframes nm-check { 0%, 72% { opacity: 0; } 74%, 86% { opacity: 1; } 89%, 100% { opacity: 0; } }
    @keyframes nm-port-glow { 0%, 70% { opacity: 0; } 73%, 91% { opacity: 1; } 95%, 100% { opacity: 0; } }
    @keyframes nm-portdoor { 0%, 70% { transform: translateY(0); } 73%, 93% { transform: translateY(-134px); } 97%, 100% { transform: translateY(0); } }
    @keyframes nm-bottle { 0%, 64% { opacity: 0; } 66%, 91% { opacity: 1; } 93%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .nm-door, .nm-door2, .nm-cart-glow, .nm-callouts, .nm-breathe, .nm-progress, .nm-tap, .nm-check, .nm-port-glow, .nm-portdoor, .nm-bottle { animation: none; }
      .nm-progress, .nm-check, .nm-callouts { opacity: 0; }
    }
  </style>

