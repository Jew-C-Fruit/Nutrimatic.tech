<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" width="940" height="520" role="img" aria-labelledby="pr-title pr-desc">
  <!--
    Nutrimatic Website - process.svg
    Version 2.2.0
    Created: 2026-09-15 - Cutaway of the kiosk showing how a drink is made (v1.0.0)
    Modified: 2026-09-15 - Compact layout; three cartridge stops pouring different colours (v2.0.0)
    Modified: 2026-09-15 - Tighter interior with a lighter background, taller mixer head, whisk turns only
    while mixing and washing (v2.1.0). Port and bay lightened (v2.1.1). Light-grey interior to match the site palette; red ready-glow (v2.1.2). Glow removed (v2.1.3). Hard edges except the bottle (v2.2.0). Sequence per Master Module/docs/SEQUENCE_DOCUMENTATION.md.
    One 20 s loop; the About page scrubs it with scroll. Reduced motion shows the "ready" state.
  -->
  <title id="pr-title">How a Nutrimatic drink is made</title>
  <desc id="pr-desc">Cutaway of the kiosk: a carriage moves a bottle along a rail from the port to the mixer, under three cartridges that each add a different powder, back to the mixer where water pours and a whisk rises through the bottle, then to the port, while the mixer washes itself in a tank.</desc>
  <defs>
    <clipPath id="pr-bottle-clip"><rect x="109" y="270" width="52" height="118" rx="11"/></clipPath>
    <clipPath id="pr-mixer-clip"><rect x="270" y="202" width="100" height="290"/></clipPath>
    <clipPath id="pr-tank-clip"><rect x="284" y="434" width="72" height="37"/></clipPath>
  </defs>
  <style>
    .pr-carriage { animation: pr-carriage 20s ease-in-out infinite; }
    .pr-bottle { animation: pr-bottle 20s ease-out infinite; }
    .pr-mixer { animation: pr-mixer 20s ease-in-out infinite; }
    .pr-layer, .pr-prime-water, .pr-blend, .pr-tankwater { transform-box: fill-box; transform-origin: 50% 100%; }
    .pr-prime-water { animation: pr-prime-water 20s linear infinite; }
    .pr-blend { animation: pr-blend 20s linear infinite; }
    .pr-tankwater { opacity: 0; animation: pr-tankwater 20s linear infinite; }
    .pr-prime, .pr-water, .pr-wash, .pr-pour { opacity: 0; }
    .pr-prime { animation: pr-prime 20s linear infinite; }
    .pr-water { animation: pr-water 20s linear infinite; }
    .pr-wash { animation: pr-wash 20s linear infinite; }
    .pr-auger-0, .pr-auger-1, .pr-auger-2 { transform-box: fill-box; transform-origin: 50% 50%; }
    .pr-ring { transform-box: fill-box; transform-origin: 50% 50%; transform: rotate(-90deg); stroke-dasharray: 125.7; stroke-dashoffset: 125.7; animation: pr-ring 20s linear infinite; }
    .pr-whisk { transform-box: fill-box; transform-origin: 50% 50%; animation: pr-spin 20s linear infinite; }
    .pr-vortex { opacity: 0; animation: pr-vortex 20s linear infinite; }
    .pr-stream { stroke-dasharray: 6 9; animation: pr-dash 0.5s linear infinite; }
    .pr-pour-0 { animation: pr-pour-0 20s linear infinite; } .pr-layer-0 { animation: pr-layer-0 20s linear infinite; } .pr-auger-0 { animation: pr-auger-0 20s linear infinite; } .pr-wig-0 { animation: pr-wig-0 20s linear infinite; }
    .pr-pour-1 { animation: pr-pour-1 20s linear infinite; } .pr-layer-1 { animation: pr-layer-1 20s linear infinite; } .pr-auger-1 { animation: pr-auger-1 20s linear infinite; } .pr-wig-1 { animation: pr-wig-1 20s linear infinite; }
    .pr-pour-2 { animation: pr-pour-2 20s linear infinite; } .pr-layer-2 { animation: pr-layer-2 20s linear infinite; } .pr-auger-2 { animation: pr-auger-2 20s linear infinite; } .pr-wig-2 { animation: pr-wig-2 20s linear infinite; }
    
    @keyframes pr-carriage { 0%, 3% { transform: translateX(0); } 8%, 14% { transform: translateX(185px); } 19%, 26% { transform: translateX(385px); } 29%, 36% { transform: translateX(585px); } 39%, 45% { transform: translateX(685px); } 51%, 70% { transform: translateX(185px); } 76%, 100% { transform: translateX(0); } }
    @keyframes pr-bottle { 0% { opacity: 0; transform: translateY(-24px); } 2.5%, 96% { opacity: 1; transform: translateY(0); } 98%, 100% { opacity: 0; transform: translateY(0); } }
    @keyframes pr-mixer { 0%, 8% { transform: translateY(0); } 10%, 12.5% { transform: translateY(184px); } 14%, 51% { transform: translateY(0); } 53%, 55% { transform: translateY(184px); } 65% { transform: translateY(94px); } 68%, 76% { transform: translateY(0); } 80%, 90% { transform: translateY(259px); } 93%, 100% { transform: translateY(0); } }
    @keyframes pr-prime { 0%, 9.5% { opacity: 0; } 10%, 12.5% { opacity: 1; } 13%, 100% { opacity: 0; } }
    @keyframes pr-prime-water { 0%, 10% { transform: scaleY(0); } 12.5%, 97% { transform: scaleY(1); } 98%, 100% { transform: scaleY(0); } }
