    @keyframes pr-layer-2 { 0%, 39.5% { transform: scaleY(0); } 45%, 97% { transform: scaleY(1); } 98%, 100% { transform: scaleY(0); } }
    @keyframes pr-auger-0 { 0%, 19.5% { transform: rotate(0deg); } 26%, 100% { transform: rotate(900deg); } }
    @keyframes pr-auger-1 { 0%, 29.5% { transform: rotate(0deg); } 36%, 100% { transform: rotate(900deg); } }
    @keyframes pr-auger-2 { 0%, 39.5% { transform: rotate(0deg); } 45%, 100% { transform: rotate(900deg); } }
    @keyframes pr-wig-0 { 0%, 19.20% { transform: translateX(0); } 19.50% { transform: translateX(1.5px); } 19.75% { transform: translateX(-1.5px); } 20.00% { transform: translateX(1.5px); } 20.25% { transform: translateX(-1.5px); } 20.50% { transform: translateX(1.5px); } 20.75% { transform: translateX(-1.5px); } 21.00% { transform: translateX(1.5px); } 21.25% { transform: translateX(-1.5px); } 21.50% { transform: translateX(1.5px); } 21.75% { transform: translateX(-1.5px); } 22.00% { transform: translateX(1.5px); } 22.25% { transform: translateX(-1.5px); } 22.50% { transform: translateX(1.5px); } 22.75% { transform: translateX(-1.5px); } 23.00% { transform: translateX(1.5px); } 23.25% { transform: translateX(-1.5px); } 23.50% { transform: translateX(1.5px); } 23.75% { transform: translateX(-1.5px); } 24.00% { transform: translateX(1.5px); } 24.25% { transform: translateX(-1.5px); } 24.50% { transform: translateX(1.5px); } 24.75% { transform: translateX(-1.5px); } 25.00% { transform: translateX(1.5px); } 25.25% { transform: translateX(-1.5px); } 25.50% { transform: translateX(1.5px); } 25.75% { transform: translateX(-1.5px); } 26.00% { transform: translateX(1.5px); } 26.30%, 100% { transform: translateX(0); } }
    @keyframes pr-wig-1 { 0%, 29.20% { transform: translateX(0); } 29.50% { transform: translateX(1.5px); } 29.75% { transform: translateX(-1.5px); } 30.00% { transform: translateX(1.5px); } 30.25% { transform: translateX(-1.5px); } 30.50% { transform: translateX(1.5px); } 30.75% { transform: translateX(-1.5px); } 31.00% { transform: translateX(1.5px); } 31.25% { transform: translateX(-1.5px); } 31.50% { transform: translateX(1.5px); } 31.75% { transform: translateX(-1.5px); } 32.00% { transform: translateX(1.5px); } 32.25% { transform: translateX(-1.5px); } 32.50% { transform: translateX(1.5px); } 32.75% { transform: translateX(-1.5px); } 33.00% { transform: translateX(1.5px); } 33.25% { transform: translateX(-1.5px); } 33.50% { transform: translateX(1.5px); } 33.75% { transform: translateX(-1.5px); } 34.00% { transform: translateX(1.5px); } 34.25% { transform: translateX(-1.5px); } 34.50% { transform: translateX(1.5px); } 34.75% { transform: translateX(-1.5px); } 35.00% { transform: translateX(1.5px); } 35.25% { transform: translateX(-1.5px); } 35.50% { transform: translateX(1.5px); } 35.75% { transform: translateX(-1.5px); } 36.00% { transform: translateX(1.5px); } 36.30%, 100% { transform: translateX(0); } }
    @keyframes pr-wig-2 { 0%, 39.20% { transform: translateX(0); } 39.50% { transform: translateX(1.5px); } 39.75% { transform: translateX(-1.5px); } 40.00% { transform: translateX(1.5px); } 40.25% { transform: translateX(-1.5px); } 40.50% { transform: translateX(1.5px); } 40.75% { transform: translateX(-1.5px); } 41.00% { transform: translateX(1.5px); } 41.25% { transform: translateX(-1.5px); } 41.50% { transform: translateX(1.5px); } 41.75% { transform: translateX(-1.5px); } 42.00% { transform: translateX(1.5px); } 42.25% { transform: translateX(-1.5px); } 42.50% { transform: translateX(1.5px); } 42.75% { transform: translateX(-1.5px); } 43.00% { transform: translateX(1.5px); } 43.25% { transform: translateX(-1.5px); } 43.50% { transform: translateX(1.5px); } 43.75% { transform: translateX(-1.5px); } 44.00% { transform: translateX(1.5px); } 44.25% { transform: translateX(-1.5px); } 44.50% { transform: translateX(1.5px); } 44.75% { transform: translateX(-1.5px); } 45.00% { transform: translateX(1.5px); } 45.30%, 100% { transform: translateX(0); } }
    @keyframes pr-spin { 0% { transform: scaleX(1); } 52.80% { transform: scaleX(1); } 53.00% { transform: scaleX(1); } 53.50% { transform: scaleX(0.15); } 54.00% { transform: scaleX(1); } 54.50% { transform: scaleX(0.15); } 55.00% { transform: scaleX(1); } 55.50% { transform: scaleX(0.15); } 56.00% { transform: scaleX(1); } 56.50% { transform: scaleX(0.15); } 57.00% { transform: scaleX(1); } 57.50% { transform: scaleX(0.15); } 58.00% { transform: scaleX(1); } 58.50% { transform: scaleX(0.15); } 59.00% { transform: scaleX(1); } 59.50% { transform: scaleX(0.15); } 60.00% { transform: scaleX(1); } 60.50% { transform: scaleX(0.15); } 61.00% { transform: scaleX(1); } 61.50% { transform: scaleX(0.15); } 62.00% { transform: scaleX(1); } 62.50% { transform: scaleX(0.15); } 63.00% { transform: scaleX(1); } 63.50% { transform: scaleX(0.15); } 64.00% { transform: scaleX(1); } 64.50% { transform: scaleX(0.15); } 65.00% { transform: scaleX(1); } 65.50% { transform: scaleX(0.15); } 66.00% { transform: scaleX(1); } 66.20% { transform: scaleX(1); } 80.80% { transform: scaleX(1); } 81.00% { transform: scaleX(1); } 81.50% { transform: scaleX(0.15); } 82.00% { transform: scaleX(1); } 82.50% { transform: scaleX(0.15); } 83.00% { transform: scaleX(1); } 83.50% { transform: scaleX(0.15); } 84.00% { transform: scaleX(1); } 84.50% { transform: scaleX(0.15); } 85.00% { transform: scaleX(1); } 85.50% { transform: scaleX(0.15); } 86.00% { transform: scaleX(1); } 86.50% { transform: scaleX(0.15); } 87.00% { transform: scaleX(1); } 87.50% { transform: scaleX(0.15); } 88.00% { transform: scaleX(1); } 88.50% { transform: scaleX(0.15); } 89.00% { transform: scaleX(1); } 89.50% { transform: scaleX(0.15); } 90.00% { transform: scaleX(1); } 90.20% { transform: scaleX(1); } 100% { transform: scaleX(1); } }
    @keyframes pr-water { 0%, 53% { opacity: 0; } 53.5%, 63% { opacity: 1; } 63.5%, 100% { opacity: 0; } }
    @keyframes pr-blend { 0%, 54% { transform: scaleY(0); } 66%, 97% { transform: scaleY(1); } 98%, 100% { transform: scaleY(0); } }
    @keyframes pr-vortex { 0%, 55% { opacity: 0; } 57%, 64% { opacity: 1; } 66%, 100% { opacity: 0; } }
    @keyframes pr-wash { 0%, 80.5% { opacity: 0; } 81%, 88% { opacity: 1; } 88.5%, 100% { opacity: 0; } }
    @keyframes pr-tankwater { 0%, 80.5% { opacity: 1; transform: scaleY(0); } 88% { opacity: 1; transform: scaleY(1); } 90.5%, 100% { opacity: 1; transform: scaleY(0); } }
    @keyframes pr-ring { 0%, 3% { stroke-dashoffset: 125.7; opacity: 1; } 76% { stroke-dashoffset: 0; opacity: 1; } 78%, 100% { stroke-dashoffset: 0; opacity: 0; } }
    @keyframes pr-dash { to { stroke-dashoffset: -15; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .pr-ring { opacity: 0; }
    }
  </style>

