    @keyframes pr-pour-1 { 0%, 29.0% { opacity: 0; } 29.5%, 35.5% { opacity: 1; } 36%, 100% { opacity: 0; } }
    @keyframes pr-pour-2 { 0%, 39.0% { opacity: 0; } 39.5%, 44.5% { opacity: 1; } 45%, 100% { opacity: 0; } }
    @keyframes pr-layer-0 { 0%, 19.5% { transform: scaleY(0); } 26%, 97% { transform: scaleY(1); } 98%, 100% { transform: scaleY(0); } }
