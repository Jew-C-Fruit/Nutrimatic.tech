# Nutrimatic Website - deploy-website.yml
# Version 1.1.0
# Created: 2026-09-13 - Publish the site to GitHub Pages (v1.0.0)
# Modified: 2026-09-21 - The site is its own repo: publish the repo root minus docs and tooling (v1.1.0)
#
# One-time setup: repo Settings -> Pages -> "Build and deployment" -> Source: GitHub Actions.
# (configure-pages below tries to switch that on by itself on the first run.)
# After that every push to main deploys; or run this workflow manually.
# The custom domain comes from CNAME (nutrimatic.tech); DNS lives at Squarespace.

name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site (drop docs and tooling)
        run: |
          mkdir -p dist
          rsync -a --exclude .git --exclude .github --exclude dist --exclude .gitignore \
            --exclude README.md --exclude GO-LIVE.md --exclude squarespace --exclude tools \
            ./ dist/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
